name: Update release data

# Writes docs/data/releases.json from the public What-Next GitHub releases so the
# website's APK page does not depend on visitors' browsers hitting the GitHub API.

on:
  schedule:
    - cron: "23 */3 * * *"      # every 3 hours
  workflow_dispatch:             # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-release-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch release data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/fetch_releases.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/data/releases.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/releases.json
          git commit -m "chore: update release data"
          git push
